name: distriflow-real
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: distriflow
      POSTGRES_USER: distriflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_real_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distriflow -d distriflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["full"]
    build: ../backend
    command: sh -c "python -m app.setup.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://distriflow:${POSTGRES_PASSWORD}@db:5432/distriflow
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    profiles: ["full"]
    image: node:22-alpine
    working_dir: /app
    volumes: [../frontend:/app]
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_URL: /api/v1
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
volumes:
  postgres_real_data:
